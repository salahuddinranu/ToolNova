<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-container { max-width: 400px; margin: 4rem auto; padding: 2.5rem; background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
    .auth-container h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; color: var(--color-text); }
    .auth-input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); font-size: 1rem; }
    .google-btn { background: #fff; color: #333; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-weight: 600; width: 100%; padding: 0.8rem; border-radius: 8px; cursor: pointer; margin-bottom: 1rem; transition: 0.2s; }
    .google-btn:hover { background: #f1f1f1; }
    .divider { text-align: center; margin: 1.5rem 0; position: relative; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--color-border); z-index: 1; }
    .divider span { background: var(--color-card); padding: 0 10px; position: relative; z-index: 2; color: var(--color-text-muted); font-size: 0.9rem; }
    .forgot-link { font-size: 0.85rem; color: var(--color-primary); cursor: pointer; display: block; text-align: right; margin-bottom: 1rem; text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    .msg-box { padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; text-align: center; font-weight: 600; }
    .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/all-tools.html">All Tools</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button>
      </div>
    </nav>
  </div>
</header>

<main class="container">
  <div class="auth-container">
    <h1 id="auth-title">Welcome Back</h1>
    
    <div id="msg-box" class="msg-box"></div>

    <!-- Google Login Button -->
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span>or use email</span></div>

    <form id="auth-form">
      <input type="email" id="email" class="auth-input" placeholder="Email Address" required>
      <input type="password" id="password" class="auth-input" placeholder="Password" required>
      
      <a id="forgot-pass-link" class="forgot-link" onclick="resetPassword()">Forgot Password?</a>
      
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-secondary);">
      <span id="toggle-text">Don't have an account?</span> 
      <a id="toggle-link" onclick="toggleAuthMode()" style="color: var(--color-primary); cursor: pointer; font-weight: bold;">Sign Up</a>
    </div>
  </div>
</main>

<script>
  // Supabase Credentials (Direct Added)
  const SUPABASE_URL = "https://vstehjndnusosehzjmab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGVoam5kbnVzb3NlaHpqbWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MTQwMDksImV4cCI6MjExMTA5MDAwOX0.YN5KhlO1ORps2w8R3EHc-EY6V1bUTf1YFxqQYJmQXpA";
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isLoginMode = true;

  // Function to show messages
  function showMessage(text, type) {
    const box = document.getElementById('msg-box');
    box.textContent = text;
    box.className = `msg-box msg-${type}`;
    box.style.display = 'block';
  }

  function hideMessage() {
    document.getElementById('msg-box').style.display = 'none';
  }

  // Toggle between Login and Signup
  window.toggleAuthMode = function() {
    isLoginMode = !isLoginMode;
    hideMessage();
    
    document.getElementById('auth-title').textContent = isLoginMode ? "Welcome Back" : "Create an Account";
    document.getElementById('submit-btn').textContent = isLoginMode ? "Log In" : "Sign Up";
    document.getElementById('toggle-text').textContent = isLoginMode ? "Don't have an account?" : "Already have an account?";
    document.getElementById('toggle-link').textContent = isLoginMode ? "Sign Up" : "Log In";
    
    // Forgot password link ko sirf login mode mein dikhayein
    document.getElementById('forgot-pass-link').style.display = isLoginMode ? 'block' : 'none';
  }

  // Google Login
  window.loginWithGoogle = async function() {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/dashboard.html' }
    });
    if(error) showMessage(error.message, 'error');
  }

  // Forgot Password Logic
  window.resetPassword = async function() {
    const email = document.getElementById('email').value;
    if(!email) return showMessage("Please enter your email address first.", "error");
    
    showMessage("Sending reset link...", "success");
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/dashboard.html',
    });

    if (error) {
      showMessage(error.message, 'error');
    } else {
      showMessage("Password reset link sent to your email!", "success");
    }
  }

  // Main Form Submit (Login/Signup)
  document.getElementById('auth-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    hideMessage();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');

    btn.disabled = true;
    btn.textContent = "Please wait...";

    try {
      if (isLoginMode) {
        // LOGIN LOGIC
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error) {
          if (error.message.includes("Invalid login credentials")) {
            throw new Error("Account not found or incorrect password. Please Sign Up first.");
          }
          throw error;
        }
        
        showMessage("Login successful! Redirecting...", "success");
        setTimeout(() => window.location.href = "/dashboard.html", 1000);

      } else {
        // SIGNUP LOGIC
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        
        if (error) throw error;
        
        // Agar user pehle se mojood hai (Supabase tells us if user is already registered)
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          throw new Error("This email is already registered. Please Log In instead.");
        }
        
        if (data.user && data.session === null) {
          showMessage("Account created! Please check your email to verify.", "success");
        } else {
          showMessage("Account created successfully! Redirecting...", "success");
          setTimeout(() => window.location.href = "/dashboard.html", 1000);
        }
      }
    } catch (error) {
      showMessage(error.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = isLoginMode ? "Log In" : "Sign Up";
    }
  });

  // PAGE LOAD: Check if user is already logged in
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      // Agar user pehle se login hai to seedha dashboard bhej do
      window.location.href = "/dashboard.html";
    }
  });
</script>
  <script src="/assets/js/auto-links.js"></script>
</body>
</html>
