<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split PDF — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>

<main class="container" style="max-width:800px;padding:3rem 1rem;">
  <h1 style="font-size:2rem;margin-bottom:0.5rem;">Split PDF</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Extract specific pages from your PDF document.</p>

  <div style="border:2px dashed var(--color-border);padding:3rem 1rem;text-align:center;border-radius:12px;background:var(--color-bg-secondary);margin-bottom:1.5rem;cursor:pointer;" onclick="document.getElementById('pdf-input').click()">
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none;">
    <div style="font-size:2rem;margin-bottom:1rem;">📄</div>
    <h3>Click to select a PDF</h3>
  </div>

  <div id="controls" style="display:none; background:var(--color-card); padding:1.5rem; border-radius:12px; border:1px solid var(--color-border);">
    <div style="margin-bottom:1rem;">
      <label style="font-size:0.9rem;font-weight:bold;">Pages to Extract (e.g., 1, 3, 5-7)</label>
      <input type="text" id="pages" placeholder="Leave blank for all pages" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-top:0.5rem;">
      <small style="color:var(--color-text-muted);">Total pages: <span id="total-pages">0</span></small>
    </div>
    <button class="btn btn-primary" onclick="splitPDF()" style="width:100%;">Split & Download</button>
    <p id="status" style="text-align:center;margin-top:1rem;font-weight:bold;"></p>
  </div>
</main>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
  let pdfFile = null;
  let totalPages = 0;
  const input = document.getElementById('pdf-input');
  const controls = document.getElementById('controls');
  const pagesInput = document.getElementById('pages');

  input.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if(!file) return;
    pdfFile = file;
    
    const arrayBuffer = await file.arrayBuffer();
    const { PDFDocument } = PDFLib;
    const pdf = await PDFDocument.load(arrayBuffer);
    totalPages = pdf.getPageCount();
    
    document.getElementById('total-pages').textContent = totalPages;
    controls.style.display = 'block';
  });

  async function splitPDF() {
    if(!pdfFile) return;
    const status = document.getElementById('status');
    status.textContent = "Processing... Please wait.";
    status.style.color = "var(--color-primary)";

    try {
      const { PDFDocument } = PDFLib;
      const arrayBuffer = await pdfFile.arrayBuffer();
      const srcPdf = await PDFDocument.load(arrayBuffer);
      
      const newPdf = await PDFDocument.create();
      let pagesToExtract = [];

      const inputVal = pagesInput.value.trim();
      if(inputVal === "") {
        // Extract all pages
        pagesToExtract = Array.from({length: totalPages}, (_, i) => i);
      } else {
        // Parse input like "1, 3, 5-7"
        const parts = inputVal.split(',');
        parts.forEach(part => {
          part = part.trim();
          if(part.includes('-')) {
            const [start, end] = part.split('-').map(Number);
            for(let i = start; i <= end; i++) pagesToExtract.push(i - 1); // 0-indexed
          } else {
            pagesToExtract.push(Number(part) - 1);
          }
        });
      }

      // Filter valid pages
      pagesToExtract = pagesToExtract.filter(p => p >= 0 && p < totalPages);

      if(pagesToExtract.length === 0) throw new Error("Invalid page numbers.");

      const copiedPages = await newPdf.copyPages(srcPdf, pagesToExtract);
      copiedPages.forEach(page => newPdf.addPage(page));

      const pdfBytes = await newPdf.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ToolNova-Split.pdf';
      a.click();
      URL.revokeObjectURL(url);

      status.textContent = "✅ Done! PDF downloaded.";
      status.style.color = "var(--color-success)";

    } catch (error) {
      status.textContent = "❌ Error: " + error.message;
      status.style.color = "var(--color-error)";
    }
  }
</script>
</body></html>
