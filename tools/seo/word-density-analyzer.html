<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Density Analyzer — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
  <style>
    .table-container { margin-top: 1.5rem; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--color-bg-tertiary); padding: 1rem; font-size: 0.9rem; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:800px;padding:3rem 1rem;">
  <h1>Word Density Analyzer</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Check the frequency and density of keywords in your text for SEO.</p>

  <textarea id="text-input" style="width:100%;height:200px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-bottom:1rem;" placeholder="Paste your article or text here..."></textarea>
  <button class="btn btn-primary" onclick="analyze()">Analyze Text</button>

  <div id="results" style="display:none; margin-top:2rem;">
    <div style="display:flex; gap:1rem; margin-bottom:1rem;">
      <div style="flex:1; background:var(--color-bg-secondary); padding:1rem; border-radius:8px; text-align:center; border:1px solid var(--color-border);">
        <div style="font-size:1.5rem; font-weight:bold; color:var(--color-primary);" id="total-words">0</div>
        <div style="font-size:0.8rem; color:var(--color-text-muted);">Total Words</div>
      </div>
      <div style="flex:1; background:var(--color-bg-secondary); padding:1rem; border-radius:8px; text-align:center; border:1px solid var(--color-border);">
        <div style="font-size:1.5rem; font-weight:bold; color:var(--color-primary);" id="unique-words">0</div>
        <div style="font-size:0.8rem; color:var(--color-text-muted);">Unique Words</div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>Keyword</th><th>Count</th><th>Density</th></tr>
        </thead>
        <tbody id="keyword-list">
          <!-- Rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>
</main>
<script>
  function analyze() {
    const text = document.getElementById('text-input').value.toLowerCase();
    if(!text.trim()) return alert("Please enter some text.");
    
    // Remove punctuation and split by spaces
    const words = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").split(/\s+/).filter(w => w.length > 0);
    const totalWords = words.length;
    
    if(totalWords === 0) return;

    // Count frequencies
    const freq = {};
    words.forEach(word => { freq[word] = (freq[word] || 0) + 1; });

    // Convert to array and sort by count
    const sorted = Object.keys(freq).map(word => {
      return { word: word, count: freq[word] };
    }).sort((a, b) => b.count - a.count);

    // Get top 10 keywords
    const topKeywords = sorted.slice(0, 10);

    // Populate UI
    document.getElementById('total-words').textContent = totalWords;
    document.getElementById('unique-words').textContent = sorted.length;

    const tbody = document.getElementById('keyword-list');
    tbody.innerHTML = '';
    topKeywords.forEach(item => {
      const density = ((item.count / totalWords) * 100).toFixed(2);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="font-weight:bold;">${item.word}</td><td>${item.count}</td><td style="color:var(--color-primary); font-weight:bold;">${density}%</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('results').style.display = 'block';
  }
</script>
</body></html>
