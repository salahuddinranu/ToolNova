<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Resizer — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>

<main class="container" style="max-width:800px;padding:3rem 1rem;">
  <h1 style="font-size:2rem;margin-bottom:0.5rem;">Image Resizer</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Resize your images to exact dimensions perfectly in your browser.</p>

  <div style="border:2px dashed var(--color-border);padding:3rem 1rem;text-align:center;border-radius:12px;background:var(--color-bg-secondary);margin-bottom:1.5rem;cursor:pointer;" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" accept="image/*" style="display:none;">
    <div style="font-size:2rem;margin-bottom:1rem;">🖼️</div>
    <h3>Click to select an image</h3>
  </div>

  <div id="controls" style="display:none; background:var(--color-card); padding:1.5rem; border-radius:12px; border:1px solid var(--color-border);">
    <div style="display:flex; gap:1rem; margin-bottom:1rem;">
      <div style="flex:1;">
        <label style="font-size:0.9rem;font-weight:bold;">Width (px)</label>
        <input type="number" id="width" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
      </div>
      <div style="flex:1;">
        <label style="font-size:0.9rem;font-weight:bold;">Height (px)</label>
        <input type="number" id="height" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
      </div>
    </div>
    <label style="display:block; margin-bottom:1rem;"><input type="checkbox" id="keep-ratio" checked> Maintain Aspect Ratio</label>
    <button class="btn btn-primary" onclick="resizeImage()" style="width:100%;">Resize & Download</button>
  </div>
</main>

<script>
  let originalImage = null;
  const fileInput = document.getElementById('file-input');
  const controls = document.getElementById('controls');
  const wInput = document.getElementById('width');
  const hInput = document.getElementById('height');
  const ratioCheck = document.getElementById('keep-ratio');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = function(event) {
      originalImage = new Image();
      originalImage.onload = function() {
        wInput.value = originalImage.width;
        hInput.value = originalImage.height;
        controls.style.display = 'block';
      };
      originalImage.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Auto-calculate height/width for aspect ratio
  wInput.addEventListener('input', function() {
    if(ratioCheck.checked && originalImage) {
      const ratio = originalImage.height / originalImage.width;
      hInput.value = Math.round(wInput.value * ratio);
    }
  });
  hInput.addEventListener('input', function() {
    if(ratioCheck.checked && originalImage) {
      const ratio = originalImage.width / originalImage.height;
      wInput.value = Math.round(hInput.value * ratio);
    }
  });

  function resizeImage() {
    if(!originalImage) return;
    const w = parseInt(wInput.value);
    const h = parseInt(hInput.value);
    
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    
    // High quality resizing
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(originalImage, 0, 0, w, h);
    
    // Convert to blob and download
    canvas.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'resized-image.jpg';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/jpeg', 0.9);
  }
</script>
</body></html>
