<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
  <style>
    .tool-wrapper { max-width: 800px; margin: 0 auto; padding: 3rem 1rem; }
    .drop-zone { border: 2px dashed var(--color-border); border-radius: 12px; padding: 3rem 1rem; text-align: center; background: var(--color-bg-secondary); cursor: pointer; margin-bottom: 1.5rem; }
    .drop-zone input { display: none; }
    .drop-zone:hover { border-color: var(--color-primary); }
    .output-area { background: var(--color-bg-secondary); padding: 2rem; border-radius: 12px; border: 1px solid var(--color-border); margin-top: 1.5rem; display: none; }
  </style>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="tool-wrapper" id="app-container">
  <!-- Content loads via JS -->
</main>
<script src="/assets/js/tools-registry.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('app-container');
    const urlParams = new URLSearchParams(window.location.search);
    const toolId = urlParams.get('id');
    
    if (!toolId) {
      container.innerHTML = `<h1>Tool Not Found</h1><p>No tool ID provided.</p>`;
      return;
    }

    // Agar registry mein tool mojood hai, to uski file load karein
    if (window.ToolNova) {
      const tool = window.ToolNova.getToolById(toolId);
      if (tool) {
        document.title = tool.name + ' — ToolNova';
        
        // Tool ki asli file ka path banayein (e.g., /tools/developer/box-shadow-generator.html)
        const filePath = `/tools/${tool.category}/${tool.id}.html`;
        
        // Page ko wahan redirect kar dein (Yeh sab se aasan aur safest tareeqa hai)
        window.location.replace(filePath);
        return;
      }
    }

    container.innerHTML = `<h1>Tool Not Found</h1><p>This tool is not yet available.</p>`;
  });
</script>
</body></html>
