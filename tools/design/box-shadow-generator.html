<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Shadow Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:800px;padding:3rem 1rem;">
  <h1>Box Shadow Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Create beautiful CSS box shadows visually.</p>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
    <div>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Horizontal Offset (<span id="x-val">0</span>px)</label>
        <input type="range" id="x" min="-50" max="50" value="0" style="width:100%;" oninput="update()">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Vertical Offset (<span id="y-val">10</span>px)</label>
        <input type="range" id="y" min="-50" max="50" value="10" style="width:100%;" oninput="update()">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Blur Radius (<span id="blur-val">20</span>px)</label>
        <input type="range" id="blur" min="0" max="100" value="20" style="width:100%;" oninput="update()">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Spread (<span id="spread-val">0</span>px)</label>
        <input type="range" id="spread" min="-50" max="50" value="0" style="width:100%;" oninput="update()">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Shadow Color</label>
        <input type="color" id="color" value="#000000" style="width:100%; height:40px; border:none; border-radius:8px;" oninput="update()">
      </div>
    </div>

    <div>
      <div id="preview" style="width:100%; height:200px; background:var(--color-card); border-radius:12px; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:center; border:1px solid var(--color-border); box-shadow: 0px 10px 20px 0px #000000;">
        Preview
      </div>
      <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">CSS Code</label>
      <textarea id="css-out" readonly style="width:100%;height:80px;padding:0.8rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;font-size:0.85rem;margin-bottom:0.5rem;"></textarea>
      <button class="btn btn-primary" style="width:100%;" onclick="copyCSS()">Copy CSS</button>
    </div>
  </div>
</main>
<script>
  function update() {
    const x = document.getElementById('x').value;
    const y = document.getElementById('y').value;
    const blur = document.getElementById('blur').value;
    const spread = document.getElementById('spread').value;
    const color = document.getElementById('color').value;

    document.getElementById('x-val').textContent = x;
    document.getElementById('y-val').textContent = y;
    document.getElementById('blur-val').textContent = blur;
    document.getElementById('spread-val').textContent = spread;

    const css = `box-shadow: ${x}px ${y}px ${blur}px ${spread}px ${color};`;
    
    document.getElementById('preview').style.boxShadow = `${x}px ${y}px ${blur}px ${spread}px ${color}`;
    document.getElementById('css-out').value = css;
  }

  function copyCSS() {
    const el = document.getElementById('css-out');
    el.select(); document.execCommand('copy');
    alert('CSS copied!');
  }

  update();
</script>
</body></html>
