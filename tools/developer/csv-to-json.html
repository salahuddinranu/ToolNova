<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV to JSON — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:900px;padding:3rem 1rem;">
  <h1>CSV to JSON Converter</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Convert CSV data into formatted JSON instantly.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Input CSV</label>
      <textarea id="input" style="width:100%;height:250px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;" placeholder="name,age,city&#10;John,30,NY&#10;Jane,25,LA"></textarea>
    </div>
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Output JSON</label>
      <textarea id="output" style="width:100%;height:250px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;" readonly></textarea>
    </div>
  </div>

  <div style="display:flex;gap:0.5rem;">
    <button class="btn btn-primary" onclick="convert()">Convert to JSON</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>
</main>
<script>
  function convert() {
    const csv = document.getElementById('input').value.trim();
    if(!csv) return;

    const lines = csv.split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    const result = [];

    for(let i=1; i<lines.length; i++) {
      const obj = {};
      const currentLine = lines[i].split(',');
      
      for(let j=0; j<headers.length; j++) {
        obj[headers[j]] = currentLine[j] ? currentLine[j].trim() : "";
      }
      result.push(obj);
    }

    document.getElementById('output').value = JSON.stringify(result, null, 2);
  }
</script>
</body></html>
