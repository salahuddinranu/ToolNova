<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Density Analyzer — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:800px;padding:3rem 1rem;">
  <h1>Word Density Analyzer</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Check keyword density for SEO.</p>
  <textarea id="text-input" style="width:100%;height:200px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-bottom:1rem;" placeholder="Paste text here..."></textarea>
  <button class="btn btn-primary" onclick="analyze()" style="width:100%;">Analyze Text</button>
  <div id="results" style="display:none; margin-top:2rem;">
    <div style="background:var(--color-bg-secondary); padding:1rem; border-radius:8px; text-align:center; margin-bottom:1rem;"><strong id="total-words">0</strong> Total Words</div>
    <div id="keyword-list" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
  </div>
</main>
<script>
  function analyze() {
    const text = document.getElementById('text-input').value.toLowerCase();
    if(!text.trim()) return alert("Please enter text.");
    const words = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").split(/\s+/).filter(w => w.length > 0);
    if(words.length === 0) return;
    const freq = {};
    words.forEach(w => freq[w] = (freq[w] || 0) + 1);
    const sorted = Object.keys(freq).map(w => ({word: w, count: freq[w]})).sort((a,b) => b.count - a.count).slice(0, 10);
    document.getElementById('total-words').textContent = words.length;
    document.getElementById('keyword-list').innerHTML = sorted.map(item => `<div style="display:flex; justify-content:space-between; background:var(--color-card); padding:0.8rem; border-radius:8px; border:1px solid var(--color-border);"><span style="font-weight:bold;">${item.word}</span><span>${item.count} (${((item.count/words.length)*100).toFixed(1)}%)</span></div>`).join('');
    document.getElementById('results').style.display = 'block';
  }
</script>
</body></html>
