<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Formatter — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:900px;padding:3rem 1rem;">
  <h1>HTML Formatter</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Beautify and indent messy HTML code perfectly.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Input HTML</label>
      <textarea id="input" style="width:100%;height:300px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;font-size:0.9rem;" placeholder="<html><body><h1>Hello</h1></body></html>"></textarea>
    </div>
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Formatted HTML</label>
      <textarea id="output" style="width:100%;height:300px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;font-size:0.9rem;" readonly placeholder="Result here..."></textarea>
    </div>
  </div>

  <div style="display:flex;gap:0.5rem;">
    <button class="btn btn-primary" onclick="formatHTML()">Format HTML</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>
</main>
<script>
  function formatHTML() {
    let html = document.getElementById('input').value;
    if(!html.trim()) return;

    // Basic HTML formatter logic
    let formatted = '';
    let indent = 0;
    
    // Split by tags
    html = html.replace(/>\s*</g, '><');
    const tags = html.split(/(<[^>]+>)/g);
    
    tags.forEach(tag => {
      if(!tag.trim()) return;
      
      // Closing tag
      if(tag.match(/^<\//)) {
        indent--;
      }
      
      formatted += '  '.repeat(Math.max(indent, 0)) + tag + '\n';
      
      // Opening tag (not self closing)
      if(tag.match(/^<[^/]/) && !tag.match(/\/>$/) && !tag.match(/<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)/i)) {
        indent++;
      }
    });

    document.getElementById('output').value = formatted.trim();
  }
</script>
</body></html>
