<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Encoder / Decoder — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1>Base64 Encoder / Decoder</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Encode text to Base64 or decode Base64 back to plain text.</p>
  <textarea id="text" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-bottom:1rem;" placeholder="Enter text or Base64..."></textarea>
  <div style="display:flex;gap:0.5rem;">
    <button class="btn btn-primary" onclick="encode()">Encode to Base64</button>
    <button class="btn btn-primary" onclick="decode()">Decode Base64</button>
    <button class="btn btn-secondary" onclick="document.getElementById('text').value=''">Clear</button>
  </div>
</main>
<script>
  function encode() {
    const t = document.getElementById('text');
    try { t.value = btoa(unescape(encodeURIComponent(t.value))); } catch(e) { alert("Error encoding text."); }
  }
  function decode() {
    const t = document.getElementById('text');
    try { t.value = decodeURIComponent(escape(atob(t.value))); } catch(e) { alert("Invalid Base64 string."); }
  }
</script>
</body></html>
