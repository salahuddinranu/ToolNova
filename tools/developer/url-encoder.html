<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Encoder / Decoder — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1>URL Encoder / Decoder</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Encode text for use in URLs, or decode URL strings back to normal text.</p>
  <textarea id="input" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-bottom:1rem;" placeholder="Enter URL or text..."></textarea>
  
  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
    <button class="btn btn-primary" onclick="encodeURI()">Encode URL</button>
    <button class="btn btn-primary" onclick="decodeURI()">Decode URL</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>

  <textarea id="output" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);" placeholder="Result will appear here..." readonly></textarea>
</main>
<script>
  function encodeURI() {
    const input = document.getElementById('input').value;
    try {
      document.getElementById('output').value = encodeURIComponent(input);
    } catch(e) {
      alert("Error encoding URL.");
    }
  }
  function decodeURI() {
    const input = document.getElementById('input').value;
    try {
      document.getElementById('output').value = decodeURIComponent(input);
    } catch(e) {
      alert("Invalid URL encoded string.");
    }
  }
</script>
</body></html>
