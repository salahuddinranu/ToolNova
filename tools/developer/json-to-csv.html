<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON to CSV — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:900px;padding:3rem 1rem;">
  <h1>JSON to CSV Converter</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Convert JSON array into CSV format.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Input JSON</label>
      <textarea id="input" style="width:100%;height:250px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;" placeholder='[{"name":"John", "age":30}, {"name":"Jane", "age":25}]'></textarea>
    </div>
    <div>
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Output CSV</label>
      <textarea id="output" style="width:100%;height:250px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-family:monospace;" readonly></textarea>
    </div>
  </div>

  <div style="display:flex;gap:0.5rem;">
    <button class="btn btn-primary" onclick="convert()">Convert to CSV</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>
</main>
<script>
  function convert() {
    const jsonText = document.getElementById('input').value.trim();
    if(!jsonText) return;

    try {
      const data = JSON.parse(jsonText);
      if(!Array.isArray(data)) {
        return alert("JSON must be an array of objects.");
      }
      if(data.length === 0) return;

      const headers = Object.keys(data[0]);
      let csv = headers.join(',') + '\n';

      data.forEach(row => {
        const line = headers.map(header => {
          let val = row[header] === undefined ? "" : row[header];
          // Handle commas inside values
          if(typeof val === 'string' && val.includes(',')) {
            val = `"${val}"`;
          }
          return val;
        }).join(',');
        csv += line + '\n';
      });

      document.getElementById('output').value = csv;
    } catch(e) {
      alert("Invalid JSON format.");
    }
  }
</script>
</body></html>
