<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remove Extra Spaces — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1>Remove Extra Spaces</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Clean up unnecessary whitespace, tabs, and line breaks from your text.</p>
  <textarea id="input" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);margin-bottom:1rem;" placeholder="Paste your messy text here..."></textarea>
  
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
    <button class="btn btn-primary" onclick="cleanText()">Clean Spaces</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>

  <textarea id="output" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);" placeholder="Cleaned text will appear here..." readonly></textarea>
</main>
<script>
  function cleanText() {
    const input = document.getElementById('input').value;
    // 1. Replace multiple spaces with single space
    // 2. Replace multiple newlines with single newline
    // 3. Trim start and end
    let cleaned = input.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n\n').trim();
    document.getElementById('output').value = cleaned;
  }
</script>
</body></html>
