<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary to Text — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1>Binary to Text Converter</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Convert binary code (0s and 1s) back into readable text.</p>

  <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Input Binary</label>
  <textarea id="input" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);font-family:monospace;margin-bottom:1rem;" placeholder="01001000 01100101 01101100 01101100 01101111"></textarea>
  
  <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;">
    <button class="btn btn-primary" onclick="convertToText()" style="flex:1;">Convert to Text</button>
    <button class="btn btn-secondary" onclick="document.getElementById('input').value='';document.getElementById('output').value='';">Clear</button>
  </div>

  <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Result</label>
  <textarea id="output" style="width:100%;height:150px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);" readonly></textarea>
</main>
<script>
  function convertToText() {
    const binary = document.getElementById('input').value.trim();
    if(!binary) return;
    
    // Split by space to get bytes
    const bytes = binary.split(' ');
    
    let text = '';
    for(let i=0; i<bytes.length; i++) {
      const byte = bytes[i];
      if(byte.length === 8 && /^[01]+$/.test(byte)) {
        const charCode = parseInt(byte, 2);
        text += String.fromCharCode(charCode);
      }
    }
    
    document.getElementById('output').value = text;
  }
</script>
</body></html>
