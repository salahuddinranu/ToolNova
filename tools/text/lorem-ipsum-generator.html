<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorem Ipsum Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1 style="font-size:2rem;margin-bottom:0.5rem;">Lorem Ipsum Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Generate dummy placeholder text for your designs.</p>

  <div style="display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-end;">
    <div style="flex:1;">
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Number of Paragraphs</label>
      <input type="number" id="para-count" value="3" min="1" max="20" style="width:100%;padding:0.8rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
    </div>
    <button class="btn btn-primary" onclick="generateLorem()">Generate</button>
  </div>

  <textarea id="output" style="width:100%;height:300px;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);margin-bottom:1rem;" readonly></textarea>
  
  <button class="btn btn-secondary" style="width:100%;" onclick="copyLorem()">Copy to Clipboard</button>
</main>
<script>
  const loremText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";

  function generateLorem() {
    const count = parseInt(document.getElementById('para-count').value);
    if(count < 1 || count > 20) return alert("Please enter a number between 1 and 20.");
    
    let result = [];
    for(let i=0; i<count; i++) {
      result.push(loremText);
    }
    document.getElementById('output').value = result.join('\n\n');
  }

  function copyLorem() {
    const el = document.getElementById('output');
    el.select(); document.execCommand('copy');
    alert('Lorem Ipsum copied to clipboard!');
  }

  generateLorem(); // Load default
</script>
</body></html>
