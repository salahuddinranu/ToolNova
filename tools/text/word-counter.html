<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Word Counter — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <style>
    .tool-page { max-width: 800px; margin: 0 auto; padding: 3rem 1rem; }
    .input-area { width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); font-size: 1rem; resize: vertical; margin-bottom: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .stat-card { background: var(--color-bg-secondary); padding: 1.25rem; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--color-border); }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--color-primary); line-height: 1.2; }
    .stat-label { font-size: 0.85rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/all-tools.html">All Tools</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button>
      </div>
    </nav>
  </div>
</header>

<main class="tool-page">
  <nav style="font-size:0.85rem;color:var(--color-text-muted);margin-bottom:1rem;">
    <a href="/">Home</a> / <a href="/all-tools.html?category=text">Text Tools</a> / Word Counter
  </nav>

  <h1 style="font-size:2rem;margin-bottom:0.5rem;">Word Counter</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Count words, characters, and sentences in real-time as you type. Everything stays in your browser.</p>

  <textarea id="text-input" class="input-area" placeholder="Type or paste your text here..."></textarea>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="word-count">0</div>
      <div class="stat-label">Words</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="char-count">0</div>
      <div class="stat-label">Characters</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="char-no-space">0</div>
      <div class="stat-label">No Spaces</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="sent-count">0</div>
      <div class="stat-label">Sentences</div>
    </div>
  </div>
</main>

<script>
  const input = document.getElementById('text-input');
  const wordCount = document.getElementById('word-count');
  const charCount = document.getElementById('char-count');
  const charNoSpace = document.getElementById('char-no-space');
  const sentCount = document.getElementById('sent-count');

  input.addEventListener('input', () => {
    const text = input.value;
    
    // Characters
    charCount.textContent = text.length;
    charNoSpace.textContent = text.replace(/\s/g, '').length;
    
    // Words
    const words = text.trim().split(/\s+/).filter(w => w.length > 0);
    wordCount.textContent = words.length;
    
    // Sentences (split by ., !, ?)
    const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
    sentCount.textContent = sentences.length;
  });
</script>
</body>
</html>
