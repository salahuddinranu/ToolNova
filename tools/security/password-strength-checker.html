<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;">
  <h1>Password Strength Checker</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Check how strong your password is and get tips to improve it.</p>

  <div style="background:var(--color-bg-secondary); padding:2rem; border-radius:12px; border:1px solid var(--color-border);">
    <input type="password" id="password" placeholder="Enter password to test..." style="width:100%; padding:1rem; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:1.1rem; margin-bottom:1rem;" oninput="checkStrength()">
    
    <div style="height:8px; background:var(--color-border); border-radius:4px; overflow:hidden; margin-bottom:1rem;">
      <div id="strength-bar" style="height:100%; width:0%; background:var(--color-error); transition:all 0.3s;"></div>
    </div>
    
    <p id="strength-text" style="font-weight:bold; text-align:center; margin-bottom:1rem;">Enter a password</p>
    <ul id="tips" style="list-style-type:disc; margin-left:1.2rem; color:var(--color-text-secondary); font-size:0.9rem;"></ul>
  </div>
</main>
<script>
  function checkStrength() {
    const pwd = document.getElementById('password').value;
    const bar = document.getElementById('strength-bar');
    const text = document.getElementById('strength-text');
    const tips = document.getElementById('tips');
    
    let strength = 0;
    let tipsList = [];

    if (pwd.length >= 8) strength++;
    else tipsList.push("Use at least 8 characters");

    if (/[A-Z]/.test(pwd)) strength++;
    else tipsList.push("Add uppercase letters");

    if (/[0-9]/.test(pwd)) strength++;
    else tipsList.push("Add numbers");

    if (/[^A-Za-z0-9]/.test(pwd)) strength++;
    else tipsList.push("Add special characters (!@#$%)");

    // Update UI
    if (pwd.length === 0) {
      bar.style.width = '0%';
      text.textContent = 'Enter a password';
      text.style.color = 'var(--color-text-muted)';
    } else if (strength <= 1) {
      bar.style.width = '25%';
      bar.style.background = 'var(--color-error)';
      text.textContent = 'Weak';
      text.style.color = 'var(--color-error)';
    } else if (strength === 2) {
      bar.style.width = '50%';
      bar.style.background = '#f59e0b';
      text.textContent = 'Fair';
      text.style.color = '#f59e0b';
    } else if (strength === 3) {
      bar.style.width = '75%';
      bar.style.background = '#3b82f6';
      text.textContent = 'Good';
      text.style.color = '#3b82f6';
    } else {
      bar.style.width = '100%';
      bar.style.background = 'var(--color-success)';
      text.textContent = 'Strong';
      text.style.color = 'var(--color-success)';
    }

    tips.innerHTML = tipsList.map(t => `<li>${t}</li>`).join('');
  }
</script>
</body></html>
