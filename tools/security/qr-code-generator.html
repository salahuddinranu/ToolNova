<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;text-align:center;">
  <h1>QR Code Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Enter a URL or text to generate a QR code.</p>
  
  <div style="display:flex;gap:0.5rem;margin-bottom:2rem;">
    <input type="text" id="qr-text" placeholder="Enter URL or text..." style="flex:1;padding:1rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
    <button class="btn btn-primary" onclick="genQR()">Generate</button>
  </div>

  <div id="qr-result" style="display:none;background:#fff;padding:1rem;border-radius:12px;display:inline-block;">
    <img id="qr-img" style="max-width:100%;" />
  </div>

</main>
<!-- Free API for QR Code -->
<script>
  function genQR() {
    const txt = document.getElementById('qr-text').value;
    if(!txt) return alert('Please enter some text or URL');
    
    const resultDiv = document.getElementById('qr-result');
    const img = document.getElementById('qr-img');
    
    // Using a free public API for QR code generation
    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(txt)}`;
    resultDiv.style.display = 'inline-block';
  }
</script>
</body></html>
