<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;">
  <h1>Password Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Generate strong, random passwords instantly.</p>
  
  <div style="background:var(--color-bg-secondary);padding:1.5rem;border-radius:12px;border:1px solid var(--color-border);">
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
      <input type="text" id="pass-output" readonly style="flex:1;padding:1rem;font-size:1.2rem;font-family:monospace;border:1px solid var(--color-border);border-radius:8px;background:var(--color-bg);color:var(--color-text);text-align:center;">
      <button class="btn btn-primary" onclick="copyPass()">Copy</button>
    </div>
    <div style="margin-bottom:1rem;">
      <label>Length: <span id="len-val">16</span></label>
      <input type="range" id="length" min="8" max="32" value="16" style="width:100%;margin-top:0.5rem;" oninput="document.getElementById('len-val').textContent=this.value; generate()">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1rem;">
      <label><input type="checkbox" id="inc-upper" checked onchange="generate()"> Uppercase (A-Z)</label>
      <label><input type="checkbox" id="inc-lower" checked onchange="generate()"> Lowercase (a-z)</label>
      <label><input type="checkbox" id="inc-num" checked onchange="generate()"> Numbers (0-9)</label>
      <label><input type="checkbox" id="inc-sym" checked onchange="generate()"> Symbols (!@#$)</label>
    </div>
    <button class="btn btn-secondary" style="width:100%;" onclick="generate()">Generate New</button>
  </div>
</main>
<script>
  function generate() {
    const len = document.getElementById('length').value;
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const num = "0123456789";
    const sym = "!@#$%^&*()_+~`|}{[]:;?><,./-=";
    
    let chars = "";
    if(document.getElementById('inc-upper').checked) chars += upper;
    if(document.getElementById('inc-lower').checked) chars += lower;
    if(document.getElementById('inc-num').checked) chars += num;
    if(document.getElementById('inc-sym').checked) chars += sym;
    
    if(!chars) { document.getElementById('pass-output').value = "Select at least one option!"; return; }
    
    let pass = "";
    for(let i=0; i<len; i++) pass += chars[Math.floor(Math.random() * chars.length)];
    document.getElementById('pass-output').value = pass;
  }
  function copyPass() {
    const el = document.getElementById('pass-output');
    el.select(); document.execCommand('copy');
   showToast('Password copied to clipboard!');
  }
  generate(); // Generate on load
</script>
</body></html>
