<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Color Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;text-align:center;">
  <h1>Random Color Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Generate beautiful random colors instantly.</p>

  <div id="color-display" style="width:100%; height:250px; border-radius:16px; box-shadow:var(--shadow-lg); margin-bottom:1.5rem; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:bold; color:white; text-shadow:0 2px 4px rgba(0,0,0,0.3); transition:background 0.3s;">#FF5733</div>

  <div style="display:flex; gap:1rem; justify-content:center;">
    <button class="btn btn-primary" style="flex:1;" onclick="generateColor()">Generate Color</button>
    <button class="btn btn-secondary" style="flex:1;" onclick="copyColor()">Copy HEX</button>
  </div>
</main>
<script>
  let currentColor = "#FF5733";
  const display = document.getElementById('color-display');

  function generateColor() {
    const randomColor = Math.floor(Math.random()*16777215).toString(16).toUpperCase();
    currentColor = "#" + randomColor.padStart(6, '0');
    
    display.textContent = currentColor;
    display.style.background = currentColor;
  }

  function copyColor() {
    navigator.clipboard.writeText(currentColor).then(() => {
      alert("Color " + currentColor + " copied to clipboard!");
    });
  }

  generateColor(); // Generate on load
</script>
</body></html>
