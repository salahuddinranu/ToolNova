<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number Generator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;">
  <h1>Random Number Generator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Generate a random number within a specific range.</p>
  
  <div style="background:var(--color-bg-secondary);padding:2rem;border-radius:12px;border:1px solid var(--color-border);text-align:center;">
    <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
      <div style="flex:1;text-align:left;">
        <label style="font-weight:bold;font-size:0.9rem;">Min</label>
        <input type="number" id="min" value="1" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
      </div>
      <div style="flex:1;text-align:left;">
        <label style="font-weight:bold;font-size:0.9rem;">Max</label>
        <input type="number" id="max" value="100" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
      </div>
    </div>
    
    <div id="result" style="font-size:4rem;font-weight:800;color:var(--color-primary);margin:1.5rem 0;line-height:1;">0</div>
    
    <button class="btn btn-primary" style="width:100%;" onclick="generate()">Generate Number</button>
  </div>
</main>
<script>
  function generate() {
    const min = Math.ceil(Number(document.getElementById('min').value));
    const max = Math.floor(Number(document.getElementById('max').value));
    
    if(min > max) return alert("Min cannot be greater than Max.");
    
    // Cryptographically secure random number
    const range = max - min + 1;
    const randomBuffer = new Uint32Array(1);
    window.crypto.getRandomValues(randomBuffer);
    const randomNumber = min + (randomBuffer[0] % range);
    
    document.getElementById('result').textContent = randomNumber;
  }
  generate();
</script>
</body></html>
