<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
  <style>
    .dice-container { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin: 2rem 0; }
    .dice { width: 80px; height: 80px; background: white; border-radius: 12px; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: #0f172a; border: 2px solid var(--color-border); transition: transform 0.2s; }
    .dice.rolling { animation: roll 0.5s ease-in-out; }
    @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
  </style>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;text-align:center;">
  <h1>Dice Roller</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Roll virtual dice for your games.</p>

  <div style="background:var(--color-bg-secondary); padding:2rem; border-radius:16px; border:1px solid var(--color-border);">
    <div style="margin-bottom:1.5rem;">
      <label style="font-weight:bold; display:block; margin-bottom:0.5rem;">Number of Dice</label>
      <input type="number" id="dice-count" value="2" min="1" max="6" style="width:100px; padding:0.5rem; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); text-align:center; font-size:1.1rem;">
    </div>

    <div class="dice-container" id="dice-container">
      <div class="dice">🎲</div>
      <div class="dice">🎲</div>
    </div>

    <button class="btn btn-primary" style="width:100%; font-size:1.2rem; padding:1rem;" onclick="rollDice()">Roll Dice</button>
    
    <div id="total-box" style="display:none; margin-top:1.5rem; font-size:1.5rem; font-weight:bold; color:var(--color-primary);">
      Total: <span id="total">0</span>
    </div>
  </div>
</main>
<script>
  const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

  function rollDice() {
    const count = parseInt(document.getElementById('dice-count').value) || 1;
    const container = document.getElementById('dice-container');
    const totalBox = document.getElementById('total-box');
    const totalSpan = document.getElementById('total');
    
    container.innerHTML = '';
    totalBox.style.display = 'none';
    
    let total = 0;
    
    for(let i=0; i<count; i++) {
      // Cryptographically secure random number 1-6
      const randomBuffer = new Uint32Array(1);
      window.crypto.getRandomValues(randomBuffer);
      const num = (randomBuffer[0] % 6) + 1;
      
      total += num;
      
      const die = document.createElement('div');
      die.className = 'dice rolling';
      // Unicode dice faces for 1-6
      die.textContent = diceFaces[num - 1];
      
      // Remove animation class after it finishes
      setTimeout(() => { die.classList.remove('rolling'); }, 500);
      
      container.appendChild(die);
    }
    
    // Show total after animation
    setTimeout(() => {
      totalSpan.textContent = total;
      totalBox.style.display = 'block';
    }, 500);
  }
</script>
</body></html>
