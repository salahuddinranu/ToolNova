<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Average Calculator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;">
  <h1>Average Calculator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Calculate the average (mean) of a set of numbers.</p>

  <div style="background:var(--color-bg-secondary); padding:2rem; border-radius:12px; border:1px solid var(--color-border);">
    <label style="font-weight:bold;display:block;margin-bottom:0.5rem;">Enter numbers (comma separated)</label>
    <textarea id="numbers" placeholder="e.g. 10, 20, 30, 40" style="width:100%; padding:1rem; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:1rem; margin-bottom:1.5rem; resize:vertical;" rows="4"></textarea>
    
    <button class="btn btn-primary" style="width:100%;" onclick="calcAverage()">Calculate Average</button>

    <div id="result" style="display:none; margin-top:2rem; text-align:center; padding-top:1.5rem; border-top:1px solid var(--color-border);">
      <p style="font-size:1rem; color:var(--color-text-muted);">The Average is</p>
      <div style="font-size:3rem; font-weight:800; color:var(--color-primary);" id="avg-val">0</div>
      <p style="font-size:0.9rem; color:var(--color-text-secondary);" id="details">Sum: 0 | Count: 0</p>
    </div>
  </div>
</main>
<script>
  function calcAverage() {
    const input = document.getElementById('numbers').value;
    if(!input.trim()) return alert('Please enter some numbers.');

    // Split by comma, convert to numbers, and remove invalid entries
    const nums = input.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));

    if(nums.length === 0) return alert('Please enter valid numbers.');

    const sum = nums.reduce((a, b) => a + b, 0);
    const avg = sum / nums.length;

    document.getElementById('avg-val').textContent = avg.toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById('details').textContent = `Sum: ${sum.toLocaleString()} | Count: ${nums.length}`;
    document.getElementById('result').style.display = 'block';
  }
</script>
</body></html>
