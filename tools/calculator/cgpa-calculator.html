<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGPA Calculator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" /><script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
  <style>
    .course-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .course-row input { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    .course-row button { padding: 0 1rem; background: var(--color-error); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:700px;padding:3rem 1rem;">
  <h1>CGPA Calculator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Calculate your GPA or CGPA easily with credit hours.</p>

  <div style="background:var(--color-card); padding:1.5rem; border-radius:12px; border:1px solid var(--color-border);">
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; font-weight:bold; font-size:0.9rem;">
      <div style="flex:2;">Course Grade (e.g. 3.5 or A)</div>
      <div style="flex:1;">Credit Hours</div>
      <div style="width:40px;"></div>
    </div>

    <div id="courses-list">
      <!-- Default rows -->
      <div class="course-row">
        <input type="number" step="0.01" placeholder="Grade (e.g. 3.5)" class="grade">
        <input type="number" placeholder="Credits (e.g. 3)" class="credit">
        <button onclick="this.parentElement.remove()">X</button>
      </div>
      <div class="course-row">
        <input type="number" step="0.01" placeholder="Grade (e.g. 3.5)" class="grade">
        <input type="number" placeholder="Credits (e.g. 3)" class="credit">
        <button onclick="this.parentElement.remove()">X</button>
      </div>
    </div>

    <button class="btn btn-secondary" style="margin-top:1rem; width:100%; font-size:0.9rem;" onclick="addRow()">+ Add Another Course</button>

    <button class="btn btn-primary" style="margin-top:1.5rem; width:100%; font-size:1.1rem;" onclick="calculateCGPA()">Calculate CGPA</button>

    <div id="result" style="display:none; margin-top:2rem; text-align:center; border-top:1px solid var(--color-border); padding-top:1.5rem;">
      <h3 style="color:var(--color-text-muted);">Your CGPA</h3>
      <div style="font-size:3rem; font-weight:800; color:var(--color-primary);" id="cgpa-val">0.00</div>
      <p id="total-credits" style="color:var(--color-text-secondary);"></p>
    </div>
  </div>
</main>
<script>
  function addRow() {
    const list = document.getElementById('courses-list');
    const row = document.createElement('div');
    row.className = 'course-row';
    row.innerHTML = `
      <input type="number" step="0.01" placeholder="Grade (e.g. 3.5)" class="grade">
      <input type="number" placeholder="Credits (e.g. 3)" class="credit">
      <button onclick="this.parentElement.remove()">X</button>
    `;
    list.appendChild(row);
  }

  function calculateCGPA() {
    const grades = document.querySelectorAll('.grade');
    const credits = document.querySelectorAll('.credit');
    
    let totalPoints = 0;
    let totalCredits = 0;

    for(let i=0; i<grades.length; i++) {
      const g = parseFloat(grades[i].value);
      const c = parseFloat(credits[i].value);

      if(!isNaN(g) && !isNaN(c)) {
        totalPoints += (g * c);
        totalCredits += c;
      }
    }

    if(totalCredits === 0) {
      alert("Please enter valid grades and credit hours.");
      return;
    }

    const cgpa = totalPoints / totalCredits;
    document.getElementById('cgpa-val').textContent = cgpa.toFixed(2);
    document.getElementById('total-credits').textContent = `Based on ${totalCredits} total credit hours`;
    document.getElementById('result').style.display = 'block';
  }
</script>
</body></html>
