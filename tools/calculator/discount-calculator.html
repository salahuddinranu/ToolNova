<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discount Calculator — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>
<main class="container" style="max-width:600px;padding:3rem 1rem;">
  <h1 style="font-size:2rem;margin-bottom:0.5rem;">Discount Calculator</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:2rem;">Calculate the final price after a discount.</p>

  <div style="background:var(--color-bg-secondary);padding:2rem;border-radius:12px;border:1px solid var(--color-border);">
    <div style="margin-bottom:1rem;">
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Original Price ($)</label>
      <input type="number" id="price" placeholder="100" style="width:100%;padding:0.8rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="font-weight:bold;font-size:0.9rem;display:block;margin-bottom:0.5rem;">Discount (%)</label>
      <input type="number" id="discount" placeholder="20" style="width:100%;padding:0.8rem;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);">
    </div>
    
    <button class="btn btn-primary" style="width:100%;" onclick="calcDiscount()">Calculate Final Price</button>

    <div id="result" style="display:none;margin-top:2rem;text-align:center;padding-top:1.5rem;border-top:1px solid var(--color-border);">
      <p style="font-size:1rem;color:var(--color-text-muted);">You Pay</p>
      <div style="font-size:3rem;font-weight:800;color:var(--color-primary);" id="final-price">$0</div>
      <p style="font-size:1rem;color:var(--color-success);font-weight:bold;" id="savings">You save $0</p>
    </div>
  </div>
</main>
<script>
  function calcDiscount() {
    const price = parseFloat(document.getElementById('price').value);
    const discount = parseFloat(document.getElementById('discount').value);

    if(isNaN(price) || isNaN(discount) || price < 0 || discount < 0 || discount > 100) {
      return alert("Please enter valid numbers. Discount should be between 0 and 100.");
    }

    const savings = (price * discount) / 100;
    const finalPrice = price - savings;

    document.getElementById('final-price').textContent = '$' + finalPrice.toFixed(2);
    document.getElementById('savings').textContent = 'You save $' + savings.toFixed(2);
    document.getElementById('result').style.display = 'block';
  }
</script>
</body></html>
