<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Tools — ToolNova</title>
  <meta name="description" content="Browse all free online tools on ToolNova: PDF, image, text, developer, calculator, security and AI tools." />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <style>
    .page-header { padding: 3rem 0 2rem; text-align: center; border-bottom: 1px solid var(--color-border); margin-bottom: 2rem; }
    .page-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .page-header p { color: var(--color-text-secondary); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; }
    .filter-btn { padding: 0.5rem 1rem; border-radius: 999px; background: var(--color-bg-tertiary); color: var(--color-text-secondary); border: 1px solid transparent; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
    .filter-btn:hover { background: var(--color-primary-light); color: var(--color-primary); }
    .filter-btn.active { background: var(--color-primary); color: #fff; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="logo">
        <span class="logo-mark">T</span><span>ToolNova</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/all-tools.html" class="active">All Tools</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button>
        <button id="mobile-menu-btn" class="icon-btn mobile-menu-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </nav>
    <div id="mobile-menu" class="mobile-menu">
      <a href="/">Home</a>
      <a href="/all-tools.html">All Tools</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-header">
    <h1>All Tools</h1>
    <p id="tool-count">Loading tools...</p>
  </div>

  <div class="search-box" style="margin-bottom:1.5rem;">
    <span class="search-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <input id="search-input" type="search" placeholder="Search tools..." />
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-category="all">All</button>
    <!-- Categories will load here -->
  </div>
  <!-- Ad Slot: All Tools -->
  <div class="ad-container" style="min-height: 90px; background: var(--color-bg-tertiary); border: 1px dashed var(--color-border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); font-size: 0.8rem; margin-bottom: 1.5rem;">
    <!-- Yahan Google AdSense ka code baad mein aayega -->
    Advertisement Space
  </div>
  <div class="tool-grid" id="tools-grid" style="margin-bottom:4rem;">
    <!-- Tools will load here -->
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:none; padding-top:0;">
      <span>© <span id="year"></span> ToolNova. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="/assets/js/tools-registry.js"></script>
<script src="/assets/js/app.js"></script>
  <script src="/assets/js/icons.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    const grid = document.getElementById('tools-grid');
    const filterBar = document.getElementById('filter-bar');
    const searchInput = document.getElementById('search-input');
    const toolCount = document.getElementById('tool-count');
    const year = document.getElementById('year');
    if(year) year.textContent = new Date().getFullYear();

    let activeCategory = 'all';
    let searchQuery = '';

    // URL se category check karein (e.g. ?category=pdf)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('category')) activeCategory = urlParams.get('category');
    if (urlParams.get('q')) { searchQuery = urlParams.get('q'); searchInput.value = searchQuery; }

    // Categories load karein
    window.ToolNova.CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (activeCategory === cat.id ? ' active' : '');
      btn.setAttribute('data-category', cat.id);
      btn.innerHTML = cat.icon + ' ' + cat.name;
      filterBar.appendChild(btn);
    });

    // Tools render karne ka function
        function renderTools() {
      grid.innerHTML = '';
      let filtered = window.ToolNova.TOOLS;

      // Category filter
      if (activeCategory !== 'all') {
        filtered = filtered.filter(t => t.category === activeCategory);
      }

      // Smart Search Filter (Search by name, description, tags, category)
      if (searchQuery) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(t => 
          t.name.toLowerCase().includes(q) || 
          t.description.toLowerCase().includes(q) || 
          t.id.includes(q) ||
          t.category.includes(q) ||
          (t.tags && t.tags.some(tag => tag.toLowerCase().includes(q)))
        );
      }

      // Update count
      toolCount.textContent = filtered.length + ' tool(s) found';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--color-text-muted);">
            <div style="font-size:3rem;margin-bottom:1rem;">🔍</div>
            <h3>No tools found for "${searchQuery}"</h3>
            <p style="margin-top:0.5rem;font-size:0.9rem;">Try searching for "image", "pdf", "compress", or "calculator".</p>
          </div>`;
        return;
      }

      // Cards banayein
      filtered.forEach(t => {
        const href = t.status === 'ready' ? '/tools/' + t.category + '/' + t.id + '.html' : '#';
        const badge = t.status === 'ready' 
          ? '<span class="badge badge-free">Ready</span>' 
          : '<span class="badge badge-pro">Coming Soon</span>';
        const typeBadge = t.type === 'ai' ? '<span class="badge badge-ai">AI</span>' : '';

        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = href;
        if (t.status === 'coming-soon') {
          card.style.opacity = '0.75';
          card.addEventListener('click', (e) => { e.preventDefault(); alert('Yeh tool jald aa raha hai!'); });
        }
        
        card.innerHTML = `
          <div class="tool-icon">${t.icon}</div>
          <h3>${t.name} ${typeBadge}</h3>
          <p>${t.description}</p>
          <div class="tool-meta">${badge}</div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter button clicks
    filterBar.addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.getAttribute('data-category');
        renderTools();
      }
    });

    // Search input
    searchInput.addEventListener('input', function(e) {
      searchQuery = e.target.value.toLowerCase();
      renderTools();
    });

    // Initial render
    renderTools();
  });
</script>
</body>
</html>
