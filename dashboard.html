<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — ToolNova</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script><script src="/assets/js/app.js" defer></script><script src="/assets/js/icons.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dash-container { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; margin-top: 2rem; }
    @media (max-width: 768px) { .dash-container { grid-template-columns: 1fr; } }
    .profile-card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2rem; text-align: center; height: fit-content; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--color-primary-light); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1rem auto; font-weight: bold; overflow: hidden; background-size: cover; background-position: center; }
    .dash-section { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; }
    .input-group input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
  </style>
</head>
<body>
<header class="site-header"><div class="container"><nav class="nav"><a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a><ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/all-tools.html">All Tools</a></li></ul><div class="nav-actions"><button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button></div></nav></div></header>

<main class="container" style="padding: 3rem 1rem;">
  <div id="loading" style="text-align:center; font-weight:bold; color:var(--color-primary);">Loading profile...</div>
  
  <div id="dash-content" style="display:none;">
    <h1 style="font-size:2rem; margin-bottom:0.5rem;">My Dashboard</h1>
    
    <div class="dash-container">
      <!-- Sidebar -->
      <div class="profile-card">
        <div class="avatar" id="user-avatar"></div>
        <h2 style="font-size:1.2rem; margin-bottom:0.25rem;" id="user-name">User Name</h2>
        <p style="font-size:0.9rem; color:var(--color-text-muted); margin-bottom:1rem;" id="user-email"></p>
        
        <div id="admin-controls" style="display:none; margin-bottom:1rem;">
          <div style="background:var(--color-primary); color:white; padding:0.25rem 0.75rem; border-radius:999px; font-size:0.75rem; font-weight:bold; margin-bottom:0.5rem;">👑 Creator</div>
          <a href="/admin.html" class="btn btn-primary" style="width:100%;">Go to Admin</a>
        </div>

        <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--color-border);">
          <p style="font-size:0.9rem; color:var(--color-text-muted);">Plan</p>
          <h3 id="plan-status" style="font-size:1.1rem; color:var(--color-text-muted);">Free</h3>
        </div>
        <button onclick="logout()" class="btn btn-secondary" style="width:100%; margin-top:1rem;">Log Out</button>
      </div>

      <!-- Main Area -->
      <div>
        <!-- Pro Upsell -->
        <div id="pro-upsell" style="display:none; background:linear-gradient(135deg, rgba(99,102,241,0.1), rgba(6,182,212,0.1)); padding:1.5rem; border-radius:12px; margin-bottom:2rem; border:1px solid var(--color-primary);">
          <h3 style="color:var(--color-primary); margin-bottom:0.5rem;">Use Tools Offline!</h3>
          <p style="font-size:0.9rem; color:var(--color-text-secondary); margin-bottom:1rem;">Upgrade to Pro to use all tools without internet.</p>
          <a href="/pro.html" class="btn btn-primary" style="font-size:0.9rem;">Get Pro Now</a>
        </div>

        <div class="dash-section">
          <h3 style="font-size:1.2rem; margin-bottom:1.5rem;">Edit Profile</h3>
          <div class="input-group">
            <label>Display Name</label>
            <input type="text" id="edit-name" placeholder="Your Name">
          </div>
          <div class="input-group">
            <label>Profile Picture URL</label>
            <input type="text" id="edit-avatar" placeholder="https://example.com/image.jpg">
          </div>
          <button class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
        </div>

        <div class="dash-section">
          <h3 style="font-size:1.2rem; margin-bottom:1.5rem;">Change Password</h3>
          <div class="input-group">
            <label>New Password</label>
            <input type="password" id="new-pass" placeholder="Enter new password">
          </div>
          <button class="btn btn-primary" onclick="updatePassword()">Update Password</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://vstehjndnusosehzjmab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGVoam5kbnVzb3NlaHpqbWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MTQwMDksImV4cCI6MjExMTA5MDAwOX0.YN5KhlO1ORps2w8R3EHc-EY6V1bUTf1YFxqQYJmQXpA";
  const ADMIN_EMAIL = "salahuddinranu@gmail.com";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;

  async function initDashboard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    document.getElementById('loading').style.display = 'none';

    if (!session) {
      window.location.href = "/login.html";
      return;
    }

    currentUser = session.user;
    document.getElementById('dash-content').style.display = 'block';
    document.getElementById('user-email').textContent = currentUser.email;
    
    // Get or Create Profile
    let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    
    if (!profile) {
      // Create default profile if not exists
      const { data: newProfile } = await supabaseClient.from('profiles').insert([{ id: currentUser.id, email: currentUser.email, full_name: currentUser.email.split('@')[0] }]).select().single();
      profile = newProfile;
    }

    if (profile) {
      document.getElementById('user-name').textContent = profile.full_name || currentUser.email.split('@')[0];
      document.getElementById('edit-name').value = profile.full_name || '';
      document.getElementById('edit-avatar').value = profile.avatar_url || '';
      
      if (profile.avatar_url) {
        document.getElementById('user-avatar').style.backgroundImage = `url(${profile.avatar_url})`;
        document.getElementById('user-avatar').textContent = '';
      } else {
        document.getElementById('user-avatar').textContent = document.getElementById('user-name').textContent.charAt(0).toUpperCase();
      }

      if (profile.is_pro) {
        document.getElementById('plan-status').textContent = "Pro (Active)";
        document.getElementById('plan-status').style.color = "var(--color-primary)";
      } else if (currentUser.email !== ADMIN_EMAIL) {
        document.getElementById('pro-upsell').style.display = 'block';
      }
    }

    if (currentUser.email === ADMIN_EMAIL) {
      document.getElementById('admin-controls').style.display = 'block';
    }

    // LOG VISIT (Analytics)
    fetch('https://api.ipify.org?format=json').then(res => res.json()).then(ipData => {
      supabaseClient.from('visitor_logs').insert([{ user_id: currentUser.id, email: currentUser.email, ip_address: ipData.ip }]);
    }).catch(() => {
      supabaseClient.from('visitor_logs').insert([{ user_id: currentUser.id, email: currentUser.email, ip_address: 'Unknown' }]);
    });
  }

  window.updateProfile = async function() {
    const newName = document.getElementById('edit-name').value;
    const newAvatar = document.getElementById('edit-avatar').value;
    
    const { error } = await supabaseClient.from('profiles').update({ full_name: newName, avatar_url: newAvatar }).eq('id', currentUser.id);
    if(error) return alert("Error: " + error.message);
    alert("Profile updated!");
    window.location.reload();
  }

  window.updatePassword = async function() {
    const newPass = document.getElementById('new-pass').value;
    if(newPass.length < 6) return alert("Password must be 6 chars.");
    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    if(error) return alert(error.message);
    alert("Password updated successfully!");
    document.getElementById('new-pass').value = '';
  }

  window.logout = async function() {
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  }

  initDashboard();
</script>
</body></html>
