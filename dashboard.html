<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — ToolNova</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='68' font-size='58' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>T</text></svg>" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/icons.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .dash-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; margin-top: 2rem; }
    @media (max-width: 768px) { .dash-grid { grid-template-columns: 1fr; } }
    .dash-card { background: var(--color-card); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--color-border); }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="/" class="logo"><span class="logo-mark">T</span><span>ToolNova</span></a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/all-tools.html">All Tools</a></li>
      </ul>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn"><span id="theme-icon">🌙</span></button>
      </div>
    </nav>
  </div>
</header>

<main class="container" style="padding:4rem 1rem;">
  <div id="loading" style="text-align:center; font-weight:bold; color:var(--color-primary);">Loading profile...</div>
  
  <div id="dash-content" style="display:none;">
    <h1 style="font-size:2rem; margin-bottom:0.5rem;">My Dashboard</h1>
    
    <div class="dash-grid">
      <div class="dash-card" style="text-align:center;">
        <div id="user-avatar" style="width:80px; height:80px; background:var(--color-primary-light); color:var(--color-primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:bold; margin:0 auto 1rem auto;"></div>
        <h2 style="font-size:1.2rem; margin-bottom:0.25rem;" id="user-email"></h2>
        
        <div id="admin-controls" style="display:none;">
          <div style="background:var(--color-primary); color:white; padding:0.25rem 0.75rem; border-radius:999px; font-size:0.75rem; font-weight:bold; display:inline-block; margin-bottom:1rem;">👑 Creator of ToolNova</div>
          <br>
          <a href="/admin.html" class="btn btn-primary" style="width:100%; margin-bottom:1rem;">Go to Admin Portal</a>
        </div>

        <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--color-border);">
          <p style="font-size:0.9rem; color:var(--color-text-muted);">Account Plan</p>
          <h3 id="plan-status" style="font-size:1.1rem; color:var(--color-success);">Free</h3>
        </div>
        
        <button onclick="logout()" class="btn btn-secondary" style="width:100%; margin-top:1rem;">Log Out</button>
      </div>

      <div class="dash-card">
        <div id="pro-upsell" style="display:none; background:linear-gradient(135deg, rgba(99,102,241,0.1), rgba(6,182,212,0.1)); padding:1.5rem; border-radius:12px; margin-bottom:2rem; border:1px solid var(--color-primary);">
          <h3 style="color:var(--color-primary); margin-bottom:0.5rem;">Use Tools Offline!</h3>
          <p style="font-size:0.9rem; color:var(--color-text-secondary); margin-bottom:1rem;">Upgrade to Pro to use all ToolNova tools without an internet connection.</p>
          <a href="/pro.html" class="btn btn-primary" style="font-size:0.9rem;">Get Pro Now</a>
        </div>

        <h3 style="font-size:1.2rem; margin-bottom:1rem;">Change Password</h3>
        <form id="pass-form" style="display:flex; flex-direction:column; gap:1rem; max-width:400px;">
          <input type="password" id="new-pass" placeholder="New Password" required style="padding:0.8rem; border-radius:8px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text);">
          <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
        </form>
        <p id="pass-msg" style="margin-top:1rem; font-weight:bold;"></p>
      </div>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://vstehjndnusosehzjmab.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGVoam5kbnVzb3NlaHpqbWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MTQwMDksImV4cCI6MjExMTA5MDAwOX0.YN5KhlO1ORps2w8R3EHc-EY6V1bUTf1YFxqQYJmQXpA";
  
  const ADMIN_EMAIL = "salahuddinranu@gmail.com";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function initDashboard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    document.getElementById('loading').style.display = 'none';

    if (!session) {
      window.location.href = "/login.html";
      return;
    }

    document.getElementById('dash-content').style.display = 'block';
    const email = session.user.email;
    document.getElementById('user-email').textContent = email;
    document.getElementById('user-avatar').textContent = email.charAt(0).toUpperCase();

    // Admin Check
    if (email === ADMIN_EMAIL) {
      document.getElementById('admin-controls').style.display = 'block';
    }

    // Pro Check
    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('is_pro')
      .eq('id', session.user.id)
      .single();

    if (profile && profile.is_pro) {
      document.getElementById('plan-status').textContent = "Pro (Active)";
      document.getElementById('plan-status').style.color = "var(--color-primary)";
    } else {
      document.getElementById('plan-status').textContent = "Free Plan";
      document.getElementById('plan-status').style.color = "var(--color-text-muted)";
      
      if (email !== ADMIN_EMAIL) {
        document.getElementById('pro-upsell').style.display = 'block';
      }
    }
  }

  document.getElementById('pass-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPass = document.getElementById('new-pass').value;
    const msg = document.getElementById('pass-msg');
    msg.style.color = "var(--color-primary)";
    msg.textContent = "Updating...";

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    
    if (error) {
      msg.style.color = "var(--color-error)";
      msg.textContent = error.message;
    } else {
      msg.style.color = "var(--color-success)";
      msg.textContent = "Password updated successfully!";
      document.getElementById('new-pass').value = '';
    }
  });

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  }

  initDashboard();
</script>
</body></html>
